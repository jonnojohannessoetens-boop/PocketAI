workflows:
  pocketai-ios-unsigned:
    name: PocketAI unsigned iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: 16.4
    scripts:
      - name: Install XcodeGen
        script: |
          set -euo pipefail
          brew install xcodegen
      - name: Generate the Xcode project
        script: |
          set -euo pipefail
          xcodegen generate --spec project.yml --project PocketAI.xcodeproj
      - name: Resolve Swift packages
        script: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project PocketAI.xcodeproj \
            -scheme PocketAI
      - name: Build unsigned iOS app and package IPA
        script: |
          set -euo pipefail
          xcodebuild \
            -project PocketAI.xcodeproj \
            -scheme PocketAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/PocketAI.app"
          test -d "$APP_PATH" || { echo "PocketAI.app was not produced" >&2; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :UIFileSharingEnabled' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :LSSupportsOpeningDocumentsInPlace' "$APP_PATH/Info.plist"

          mkdir -p artifacts/Payload
          ditto "$APP_PATH" artifacts/Payload/PocketAI.app
          (cd artifacts && /usr/bin/zip -qry PocketAI-unsigned.ipa Payload)
    artifacts:
      - artifacts/PocketAI-unsigned.ipa
