name: PocketAI
options:
  bundleIdPrefix: app.pocketai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SwiftLlama:
    url: https://github.com/pgorzelany/swift-llama-cpp
    revision: c0de205096bc735093a1b73107ca4fe52bf99877

targets:
  PocketAI:
    type: application
    platform: iOS
    sources:
      - path: Sources/PocketAI
    dependencies:
      - package: SwiftLlama
        product: SwiftLlama
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pocketai.personal
        PRODUCT_NAME: PocketAI
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PocketAI
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
